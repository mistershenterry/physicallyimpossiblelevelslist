<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PILL — Physically Impossible Levels List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7c3aed;
  --accent-dark:#6428cc;
  --bg:#ffffff;
  --panel:#ffffff;
  --text:#111418;
  --text-dim:#5b6570;
  --line:#e2e6ea;
  --input:#ffffff;
  --hover:#f3f0fa;
  --scroll:#c7ced6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Nunito Sans",system-ui,sans-serif;
  display:flex;flex-direction:column;
  overflow:hidden;
}
h1,h2,h3{font-family:Oswald,"Nunito Sans",sans-serif;letter-spacing:.01em}

/* ---------- header ---------- */
header{
  background:var(--accent);
  color:#fff;
  display:flex;align-items:center;gap:8px;
  padding:0 18px;height:60px;flex:0 0 60px;
  position:relative;z-index:20;
}
.brand{display:flex;flex-direction:column;justify-content:center;margin-right:26px;user-select:none;line-height:1}
.brand .wordmark{display:flex;align-items:baseline;gap:7px;font-family:Oswald}
.brand b{font-size:26px;font-weight:700;letter-spacing:.04em}
.brand span{font-size:12px;font-weight:500;opacity:.9}
.brand .full{
  font:700 10px "Nunito Sans",sans-serif;
  text-transform:uppercase;letter-spacing:.11em;
  opacity:.85;margin-top:4px;white-space:nowrap;
}
nav{display:flex;gap:4px;height:100%}
nav button{
  background:none;border:0;color:#fff;cursor:pointer;
  font:600 15px/1 "Nunito Sans",sans-serif;
  padding:0 16px;height:100%;
  border-bottom:3px solid transparent;
  opacity:.82;
}
nav button:hover{opacity:1;background:rgba(255,255,255,.09)}
nav button[aria-current="page"]{opacity:1;border-bottom-color:#fff}
.spacer{flex:1}
.icons{display:flex;align-items:center;gap:14px}
.icons a{
  background:none;border:0;color:#fff;cursor:pointer;
  display:grid;place-items:center;padding:4px;opacity:.9;border-radius:6px;
}
.icons a:hover{opacity:1;background:rgba(255,255,255,.14)}
.icons svg{width:21px;height:21px;fill:currentColor;display:block}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
aside{
  width:340px;flex:0 0 340px;
  border-right:1px solid var(--line);
  background:var(--panel);
  display:flex;flex-direction:column;min-height:0;
}
.searchwrap{padding:16px}
.searchwrap input{
  width:100%;padding:12px 15px;
  border:1px solid var(--line);border-radius:9px;
  background:var(--input);color:var(--text);
  font:400 15px "Nunito Sans",sans-serif;outline:none;
}
.searchwrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.18)}
.ranklist{flex:1;overflow-y:auto;padding:0 12px 24px}
.rankrow{display:flex;align-items:center;gap:14px;padding:2px 0}
.rankrow .num{flex:0 0 46px;text-align:right;color:var(--text-dim);font-weight:700;font-size:15px}
.rankrow button{
  flex:1;text-align:left;background:none;border:0;cursor:pointer;
  color:var(--text);font:600 15px "Nunito Sans",sans-serif;
  padding:11px 14px;border-radius:8px;
}
.rankrow button:hover{background:var(--hover)}
.rankrow.active button{background:var(--accent);color:#fff}
.legacy-head{
  font:700 12px "Nunito Sans";letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-dim);padding:22px 0 8px 60px;
}
.empty{padding:30px 16px;color:var(--text-dim);font-size:15px}

section.content{flex:1;overflow-y:auto;padding:26px 34px 70px}
.view{display:none}
.view.on{display:block}

/* ---------- level detail ---------- */
.level-title{
  font-size:46px;font-weight:700;text-transform:uppercase;
  margin:0 0 18px;line-height:1.05;
}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;margin-bottom:26px}
.meta dt{font:800 15px "Nunito Sans";text-transform:uppercase;letter-spacing:.02em}
.meta dd{margin:0;font-size:15px}
.embed{
  position:relative;width:100%;max-width:860px;aspect-ratio:16/9;
  background:#000;border-radius:4px;overflow:hidden;margin-bottom:22px;
}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed .novid{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;
  color:#7c8894;font:600 15px "Nunito Sans";gap:6px;
}
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  max-width:860px;text-align:center;gap:10px;margin-bottom:34px;
}
.stats div span{display:block}
.stats .k{font:800 14px "Nunito Sans";text-transform:uppercase;letter-spacing:.02em;margin-bottom:5px}
.stats .v{font-size:15px;color:var(--text)}
h2.section{font-size:31px;font-weight:700;margin:0 0 10px}
.intro{max-width:760px;font-size:15px;line-height:1.65;color:var(--text-dim);margin:0 0 26px}

::-webkit-scrollbar{width:11px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:900px){
  .brand{margin-right:14px}
  .brand b{font-size:21px}
  .brand .full{font-size:8.5px;letter-spacing:.07em}
  nav button{padding:0 10px;font-size:14px}
  main{flex-direction:column}
  aside{width:100%;flex:0 0 auto;max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}
  section.content{padding:20px 18px 60px}
  .level-title{font-size:32px}
  .stats{grid-template-columns:repeat(2,1fr);text-align:left;gap:16px}
}
@media (prefers-reduced-motion:no-preference){
  .view.on{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="wordmark"><b>PILL</b><span>v1.0.0</span></div>
    <div class="full">Physically Impossible Levels List</div>
  </div>

  <nav id="nav">
    <button data-view="list" aria-current="page">List</button>
    <button data-view="about">About</button>
  </nav>

  <div class="spacer"></div>

  <div class="icons">
    <a href="#" id="ghLink" title="GitHub repo" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.8 2.7 1.3 3.4 1 .1-.7.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.2 0-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.9 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>
    </a>
  </div>
</header>

<main>
  <aside id="sidebar">
    <div class="searchwrap">
      <input id="search" type="search" placeholder="Search levels..." autocomplete="off">
    </div>
    <div class="ranklist" id="ranklist"></div>
  </aside>

  <section class="content">
    <div class="view on" id="view-list"></div>
    <div class="view" id="view-about"></div>
  </section>
</main>

<script src="data/levels.js"></script>
<script>
/* ============================================================
   PILL — Physically Impossible Levels List
   Site config lives here. The level list lives in data/levels.js.
   ============================================================ */

const CONFIG = {
  github: "https://github.com/mistershenterry/physicallyimpossiblelevelslist",
  legacyAfter: 50     // ranks past this go under a Legacy heading
};

/* LEVELS lives in data/levels.js — that is the file you edit to add,
   remove, or reorder levels. Rank = array order. */

/* ============================================================
   Below here is machinery. You shouldn't need to touch it.
   ============================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function ytId(v){
  if (!v) return "";
  v = String(v).trim();
  if (/^[\w-]{11}$/.test(v)) return v;
  const m = v.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : "";
}

let selected = 0;
let filter = "";

/* ---------- sidebar ---------- */
function renderSidebar(){
  const q = filter.trim().toLowerCase();
  const rows = LEVELS
    .map((lv, i) => ({ lv, i }))
    .filter(({ lv }) => !q || lv.name.toLowerCase().includes(q));

  if (!rows.length){
    $("#ranklist").innerHTML = `<p class="empty">Nothing matches &ldquo;${esc(filter)}&rdquo;.</p>`;
    return;
  }

  let html = "";
  let legacyOpened = false;
  for (const { lv, i } of rows){
    const rank = i + 1;
    if (rank > CONFIG.legacyAfter && !legacyOpened){
      html += `<div class="legacy-head">Legacy</div>`;
      legacyOpened = true;
    }
    html += `<div class="rankrow ${i === selected ? "active" : ""}">
      <span class="num">#${rank}</span>
      <button data-i="${i}">${esc(lv.name)}</button>
    </div>`;
  }
  $("#ranklist").innerHTML = html;
}

/* ---------- level view ---------- */
function renderLevel(){
  const lv = LEVELS[selected];
  if (!lv){ $("#view-list").innerHTML = `<p class="empty">No levels on the list yet.</p>`; return; }

  const vid = ytId(lv.video);
  const video = vid
    ? `<iframe src="https://www.youtube-nocookie.com/embed/${esc(vid)}?rel=0" title="${esc(lv.name)}" allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>`
    : `<div class="novid"><span>No level recording</span><span style="font-size:13px;opacity:.75">There is no public recording of this level.</span></div>`;

  $("#view-list").innerHTML = `
    <h1 class="level-title">${esc(lv.name)}</h1>
    <dl class="meta">
      <dt>Creators</dt><dd>${esc(lv.creators)}</dd>
      <dt>Publisher</dt><dd>${esc(lv.publisher)}</dd>
    </dl>
    <div class="embed">${video}</div>
    <div class="stats">
      <div><span class="k">ID</span><span class="v">${esc(lv.id)}</span></div>
      <div><span class="k">FPS</span><span class="v">${esc(lv.fps)}</span></div>
      <div><span class="k">Version</span><span class="v">${esc(lv.version)}</span></div>
      <div><span class="k">TPS</span><span class="v">${esc(lv.tps)}</span></div>
    </div>`;
}

/* ---------- about ---------- */
function renderAbout(){
  $("#view-about").innerHTML = `
    <h1 class="level-title">About PILL</h1>
    <p class="intro">The Physically Impossible Levels List (PILL) ranks levels that cannot be completed by a human legitimately.</p>`;
}

/* ---------- routing ---------- */
function show(view){
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("#view-" + view).classList.add("on");
  document.querySelectorAll("nav button").forEach(b => {
    if (b.dataset.view === view) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  $("#sidebar").style.display = view === "list" ? "" : "none";
  if (view === "about") renderAbout();
}

/* ---------- wiring ---------- */
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (b) show(b.dataset.view);
});

$("#ranklist").addEventListener("click", e => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  selected = +b.dataset.i;
  renderSidebar();
  renderLevel();
  document.querySelector("section.content").scrollTop = 0;
});

$("#search").addEventListener("input", e => { filter = e.target.value; renderSidebar(); });

$("#ghLink").href = CONFIG.github;

renderSidebar();
renderLevel();
renderAbout();
</script>
</body>
</html>
